<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1a" />
    <meta name="description" content="月寄中秋 · 国风沉浸式中秋祝福站点。但愿人长久，千里共婵娟。" />
    <title>月寄中秋 · 岁岁安康</title>

    <!-- 内联 SVG 图标，避免额外图片请求 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23f4e9c9'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%23d8b96a' stroke-opacity='.5'/%3E%3C/svg%3E"
    />

    <!-- 思源宋体（Noto Serif SC），在线 CDN；离线时由系统衬线字体兜底 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 首屏底色，避免字体/JS 加载期间的白闪 -->
    <style>
      html,
      body {
        margin: 0;
        background: #070b1a;
      }
      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
